spring:
  application:
    name: historico-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:historico}
    username: ${DB_USER:historico}
    password: ${DB_PASSWORD:historico}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: historico-service
      # earliest e o que sustenta a reconstrucao do read model: apagando a base e subindo com
      # um group.id novo, o historico inteiro e refeito a partir do log.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: br.com.fiap.comum.evento
    listener:
      ack-mode: record

  graphql:
    schema:
      locations: classpath:graphql/
    graphiql:
      enabled: true
      path: /graphiql

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    # Mesmo segredo e emissor do agendamento: este servico valida o token, nunca o emite.
    secret: ${JWT_SECRET:cGFyYS1kZXNlbnZvbHZpbWVudG8tYXBlbmFzLXRyb3F1ZS1lbS1wcm9kdWNhby0xMjM0NTY3ODkw}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:120}
    emissor: agendamento-service

logging:
  level:
    br.com.fiap.historico: ${LOG_LEVEL:INFO}
