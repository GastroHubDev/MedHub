# Substitui integralmente o application.yml de main no classpath de teste.
spring:
  datasource:
    url: jdbc:h2:mem:historico_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    consumer:
      group-id: historico-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # So o teste de consumo liga o listener, apontando para o broker embarcado.
      auto-startup: false
    admin:
      auto-create: false

  graphql:
    schema:
      locations: classpath:graphql/

server:
  port: 0

app:
  jwt:
    secret: c2VncmVkby1kZS10ZXN0ZS1jb20tdGFtYW5oby1zdWZpY2llbnRlLXBhcmEtaHMyNTYtb2s=
    expiracao-minutos: 120
    emissor: agendamento-service

logging:
  level:
    org.apache.kafka: WARN
    kafka: WARN
    org.springframework.kafka: WARN
