# O nginx serve o front e encaminha as chamadas para os tres servicos.
#
# O ponto central: para o browser tudo vem de http://localhost:3000. Nao ha requisicao
# cross-origin, e por isso nenhum dos tres SecurityConfig precisou ganhar configuracao de
# CORS - o codigo Java ja testado fica intocado.

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Os arquivos mudam a cada rebuild da imagem; sem isto o browser serviria JS velho
    # depois de um docker compose up --build.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # ---- APIs -------------------------------------------------------------
    # A barra final no proxy_pass e o que faz o nginx SUBSTITUIR o prefixo casado:
    #   /api/agendamento/consultas  ->  agendamento-service:8080/api/consultas
    #   /api/agendamento/auth/login ->  agendamento-service:8080/api/auth/login

    location /api/agendamento/ {
        proxy_pass http://agendamento-service:8080/api/;
        include /etc/nginx/conf.d/proxy-comum.inc;
    }

    location /api/notificacao/ {
        proxy_pass http://notificacao-service:8081/api/;
        include /etc/nginx/conf.d/proxy-comum.inc;
    }

    location /graphql {
        proxy_pass http://historico-service:8082/graphql;
        include /etc/nginx/conf.d/proxy-comum.inc;
    }

    # ---- Health checks ----------------------------------------------------
    # Alimentam os indicadores de status no painel. Sao rotas permitAll nos tres servicos.

    location /health/agendamento {
        proxy_pass http://agendamento-service:8080/actuator/health;
        include /etc/nginx/conf.d/proxy-comum.inc;
    }

    location /health/notificacao {
        proxy_pass http://notificacao-service:8081/actuator/health;
        include /etc/nginx/conf.d/proxy-comum.inc;
    }

    location /health/historico {
        proxy_pass http://historico-service:8082/actuator/health;
        include /etc/nginx/conf.d/proxy-comum.inc;
    }
}
